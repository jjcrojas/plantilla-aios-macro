server.port=8084

aios.insumos-dir=C:\\Users\\jcrojas\\OneDrive - Superfinanciera\\Pensiones\\InformesDelegatura\\FORMATOS ACTUALIZADOS
aios.plantilla-dir=./plantillas
aios.salidas-referencia-dir=./salidas_referencia
aios.max-poi-file-mb=40
aios.macro-recalc-491-493=true

# Conexión exclusiva de AIOS. No usar spring.datasource.* porque esas variables
# pueden estar definidas globalmente para otras aplicaciones (por ejemplo Oracle).
aios.datasource.url=jdbc:teradata://10.40.176.8/DATABASE=prod_dwh_consulta,LOGMECH=LDAP
aios.datasource.driver-class-name=com.teradata.jdbc.TeraDriver
aios.datasource.username=${AIOS_DB_USER:}
aios.datasource.password=${AIOS_PASS:}
aios.datasource.maximum-pool-size=${AIOS_DB_POOL_MAX_SIZE:4}
aios.datasource.minimum-idle=${AIOS_DB_POOL_MIN_IDLE:1}
aios.datasource.connection-timeout=${AIOS_DB_CONNECTION_TIMEOUT_MS:30000}
aios.datasource.validation-timeout=${AIOS_DB_VALIDATION_TIMEOUT_MS:5000}
aios.datasource.initialization-fail-timeout=${AIOS_DB_INIT_FAIL_TIMEOUT_MS:1}

logging.level.root=INFO
logging.level.AIOS_CELDAS=INFO

# Evita que DevTools escanee recursivamente la ruta base de insumos (OneDrive),
# lo que puede causar OutOfMemoryError en el File Watcher.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

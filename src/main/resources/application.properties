server.port=8084

aios.insumos-dir=C:\\Users\\jcrojas\\OneDrive - Superfinanciera\\Pensiones\\InformesDelegatura\\FORMATOS ACTUALIZADOS
aios.plantilla-dir=./plantillas
aios.salidas-referencia-dir=./salidas_referencia
aios.max-poi-file-mb=40
aios.macro-recalc-491-493=true

spring.datasource.url=${TERADATA_JDBC_URL:jdbc:teradata://${TERADATA_HOST:localhost}/DATABASE=${TERADATA_DATABASE:DBC},TMODE=ANSI,CHARSET=UTF8}
spring.datasource.driver-class-name=com.teradata.jdbc.TeraDriver
spring.datasource.username=${TERADATA_USER:${DB_USER:}}
spring.datasource.password=${TERADATA_PASSWORD:${DB_PASS:}}
spring.datasource.hikari.maximum-pool-size=${TERADATA_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${TERADATA_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${TERADATA_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${TERADATA_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.initialization-fail-timeout=${TERADATA_INIT_FAIL_TIMEOUT_MS:1}

logging.level.root=INFO
logging.level.AIOS_CELDAS=INFO

# Evita que DevTools escanee recursivamente la ruta base de insumos (OneDrive),
# lo que puede causar OutOfMemoryError en el File Watcher.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
